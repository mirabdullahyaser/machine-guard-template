[pytest]
# Run from the repo root: `pytest` runs the fast unit tests,
# `pytest -m integration` runs the tests that call the running API.
testpaths = tests
pythonpath = .
addopts = -m "not integration" -q
markers =
    integration: calls the running API (start it first, see tests/test_api_integration.py)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
