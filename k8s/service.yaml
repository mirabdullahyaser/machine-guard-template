# A Service gives the pods one stable address and spreads requests across the ready ones.
# Pods come and go (and get new IPs); the Service stays.
#
# NodePort 30080 is mapped to localhost:8080 in the codespace by k8s/kind/kind-config.yaml.
apiVersion: v1
kind: Service
metadata:
  name: machine-guard
  labels:
    app: machine-guard
spec:
  type: NodePort
  selector:
    app: machine-guard     # send traffic to pods with this label
  ports:
    - port: 80             # the Service's own port inside the cluster
      targetPort: 8000     # the container's port
      nodePort: 30080      # the port on the kind node (30000-32767)
